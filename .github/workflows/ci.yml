name: CI Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatchling
          pip install -e .
          pip install ruff

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Unit Tests
        env:
          GEMINI_API_KEY: "mock_key_for_testing"
        run: pytest tests/ -v

      - name: Run ML Pipeline (Sample Mode)
        run: python pipelines/run_ml_pipeline.py --sample

      - name: Run RAG Pipeline (Sample Mode)
        env:
          GEMINI_API_KEY: "mock_key_for_testing"
        run: python pipelines/run_rag_pipeline.py --sample

      - name: Run Monitoring & Drift Report (Sample Mode)
        env:
          GEMINI_API_KEY: "mock_key_for_testing"
        run: python pipelines/run_monitoring.py --sample
