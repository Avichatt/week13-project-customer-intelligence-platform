[project]
name = "customer-intelligence-platform"
version = "0.1.0"
description = "Week 13 Mini-Project: Customer Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "mlflow>=2.11.0",
    "google-generativeai>=0.4.0",
    "faiss-cpu>=1.8.0",
    "evidently>=0.4.15",
    "pandera>=0.18.0",
    "pytest>=8.0.0",
    "requests>=2.31.0",
    "matplotlib>=3.8.0",
    "jinja2>=3.1.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
